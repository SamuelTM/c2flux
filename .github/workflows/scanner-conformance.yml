name: Scanner conformance

# Runs every scanner available on each OS over the synthetic test tree and
# compares what it saw with the generator's manifest, entry by entry.
# See ROADMAP.md, phase 2; the rules are in tests/conformance/check_conformance.py.

on:
  pull_request:
    paths: &conformance-paths
      - "src/c2flux.Core/**"
      - "src/c2flux.Platform.Windows/**"
      - "src/c2flux.Platform.MacOS/**"
      - "libs/NtfsReader/**"
      - "tests/c2flux.Benchmarks/**"
      - "tests/conformance/**"
      - "tests/fixtures/**"
      - ".github/actions/ntfs-test-volume/**"
      - ".github/workflows/scanner-conformance.yml"
  push:
    branches:
      - cross-platform
    paths: *conformance-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Conformance (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish app and benchmark tool
        run: |
          dotnet publish src/c2flux.WinForms/c2flux.csproj --configuration Release --runtime win-x64 --self-contained false --output "$env:RUNNER_TEMP\app"
          dotnet publish tests/c2flux.Benchmarks/c2flux.Benchmarks.csproj --configuration Release --output "$env:RUNNER_TEMP\bench"

      - name: Create NTFS test volume (T:)
        id: volume
        uses: ./.github/actions/ntfs-test-volume
        with:
          generator: tests/fixtures/generate_test_tree.py
          profile: small
          manifest: ${{ runner.temp }}/manifest.json
          required: "true"

      - name: Scan and compare
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'conformance'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "## Scanner conformance (Windows)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          # MFT scanners read the whole volume directly: they see the tree as a
          # subfolder, count a hard-linked file once and ignore permissions.
          $mft = @('--subtree', 'tree', '--hardlinks', 'once', '--permissions', 'ignored')
          $targets = @(
            @{ Scanner = 'c2flux';    Path = 'T:\';     Rules = $mft },
            @{ Scanner = 'ntfsmft';   Path = 'T:\';     Rules = $mft },
            @{ Scanner = 'ntquery';   Path = 'T:\tree'; Rules = @() },
            @{ Scanner = 'win32find'; Path = 'T:\tree'; Rules = @() },
            @{ Scanner = 'managed';   Path = 'T:\tree'; Rules = @() }
          )
          $failed = @()

          foreach ($target in $targets) {
            $dump = Join-Path $out "$($target.Scanner).dump"
            & "$env:RUNNER_TEMP\bench\c2flux-bench.exe" --app "$env:RUNNER_TEMP\app" --scanner $target.Scanner --path $target.Path --dump $dump | Out-File -FilePath (Join-Path $out "$($target.Scanner).json") -Encoding utf8
            if (-not (Test-Path $dump)) {
              "$($target.Scanner): no result (see artifact)`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              $failed += $target.Scanner
              continue
            }
            $rules = $target.Rules
            python tests/conformance/check_conformance.py --manifest "$env:RUNNER_TEMP\manifest.json" --dump $dump @rules --scanner "$($target.Scanner) (Windows)" --json-out (Join-Path $out "$($target.Scanner).conformance.json") --summary-out $env:GITHUB_STEP_SUMMARY
            if ($LASTEXITCODE -ne 0) { $failed += $target.Scanner }
          }
          if ($failed.Count -gt 0) { throw "Conformance failed: $($failed -join ', ')" }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scanner-conformance-windows-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/conformance
            ${{ runner.temp }}/manifest.json
          retention-days: 14

  unix:
    name: Conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The platform project of this OS (it brings c2flux.Core with the
      # managed scanner); Linux has no native scanner yet, so only Core.
      - name: Build scanners and benchmark tool
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            dotnet build src/c2flux.Platform.MacOS/c2flux.Platform.MacOS.csproj --configuration Release --output "$RUNNER_TEMP/scanners"
            echo "MAIN_ASSEMBLY=c2flux.Platform.MacOS.dll" >> "$GITHUB_ENV"
            echo "SCANNERS=attrlistbulk managed" >> "$GITHUB_ENV"
          else
            dotnet build src/c2flux.Core/c2flux.Core.csproj --configuration Release --output "$RUNNER_TEMP/scanners"
            echo "MAIN_ASSEMBLY=c2flux.Core.dll" >> "$GITHUB_ENV"
            echo "SCANNERS=managed" >> "$GITHUB_ENV"
          fi
          dotnet build tests/c2flux.Benchmarks/c2flux.Benchmarks.csproj --configuration Release --output "$RUNNER_TEMP/bench"

      - name: Generate test tree
        run: python tests/fixtures/generate_test_tree.py "$RUNNER_TEMP/tree" --profile small --manifest "$RUNNER_TEMP/manifest.json"

      - name: Scan and compare
        run: |
          mkdir -p "$RUNNER_TEMP/conformance"
          echo "## Scanner conformance (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          failed=""
          for scanner in $SCANNERS; do
            dotnet "$RUNNER_TEMP/bench/c2flux-bench.dll" --app "$RUNNER_TEMP/scanners" --main-assembly "$MAIN_ASSEMBLY" --scanner "$scanner" --path "$RUNNER_TEMP/tree" --dump "$RUNNER_TEMP/conformance/$scanner.dump" > "$RUNNER_TEMP/conformance/$scanner.json"
            python tests/conformance/check_conformance.py --manifest "$RUNNER_TEMP/manifest.json" --dump "$RUNNER_TEMP/conformance/$scanner.dump" --scanner "$scanner (${{ matrix.os }})" --json-out "$RUNNER_TEMP/conformance/$scanner.conformance.json" --summary-out "$GITHUB_STEP_SUMMARY" || failed="$failed $scanner"
          done
          if [ -n "$failed" ]; then echo "Conformance failed:$failed"; exit 1; fi

      # Rough speed against du on a large system folder, to judge whether a
      # native scanner is worth it on this OS (phase 3). Informational.
      - name: Speed probe (scanners vs du on /usr)
        run: |
          echo "### Speed probe: /usr (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for scanner in $SCANNERS; do
            for run in 1 2 3; do
              dotnet "$RUNNER_TEMP/bench/c2flux-bench.dll" --app "$RUNNER_TEMP/scanners" --main-assembly "$MAIN_ASSEMBLY" --scanner "$scanner" --path /usr \
                | python -c "import json,sys; d=json.load(sys.stdin); t=d.get('tree') or {}; print('- %s run %s: %.0f ms, %s files, %s directories' % ('$scanner', '$run', d.get('elapsed_ms', 0), t.get('files'), t.get('directories')))" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          for run in 1 2 3; do
            start=$(date +%s%N 2>/dev/null || python -c 'import time; print(time.time_ns())')
            du -sk /usr > /dev/null 2>&1 || true
            end=$(date +%s%N 2>/dev/null || python -c 'import time; print(time.time_ns())')
            echo "- du run $run: $(( (end - start) / 1000000 )) ms" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scanner-conformance-${{ matrix.os }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/conformance
            ${{ runner.temp }}/manifest.json
          retention-days: 14
