name: CI

on:
  push:
    branches:
      - master
      - cross-platform
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore c2flux.sln

      - name: Build
        run: dotnet build c2flux.sln --configuration Release --no-restore

  core-tests:
    name: Core and app tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Builds only c2flux.Core and its tests: plain net10.0, no Windows
      # Desktop pieces, so it must work everywhere.
      - name: Test
        run: dotnet test tests/c2flux.Core.Tests/c2flux.Core.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      # The Avalonia app on the headless platform: no display needed. The
      # captures (phase 5.4) are compared with the WinForms references.
      - name: Test app
        run: dotnet test tests/c2flux.App.Tests/c2flux.App.Tests.csproj --configuration Release
        env:
          C2FLUX_CHART_OUT: ${{ runner.temp }}/captures

      - name: Compare captures with the references
        if: always()
        shell: bash
        run: |
          python3 tests/fidelity/compare.py "$RUNNER_TEMP/captures" --out "$RUNNER_TEMP/captures/fidelity.md"
          cat "$RUNNER_TEMP/captures/fidelity.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-captures-${{ matrix.os }}
          path: ${{ runner.temp }}/captures
          retention-days: 7

  # The extent readers on file systems with clones. Regular tests cover APFS on
  # arm64 (macos-latest); Intel calls fcntl differently, so it runs here. A
  # failing fcntl falls back to the clone id, which the partly rewritten clone
  # in the test catches.
  clone-volumes:
    name: Clones on real volumes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Create XFS and Btrfs volumes
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs btrfs-progs
          for fs in xfs btrfs; do
            truncate -s 1G "$RUNNER_TEMP/$fs.img"
            sudo "mkfs.$fs" -q "$RUNNER_TEMP/$fs.img"
            sudo mkdir -p "/mnt/$fs"
            sudo mount -o loop "$RUNNER_TEMP/$fs.img" "/mnt/$fs"
            sudo chown "$(id -u):$(id -g)" "/mnt/$fs"
          done
          btrfs subvolume create /mnt/btrfs/one
          btrfs subvolume create /mnt/btrfs/two
          echo "C2FLUX_CLONE_DIRS=/mnt/xfs:/mnt/btrfs" >> "$GITHUB_ENV"
          echo "C2FLUX_BTRFS_SUBVOLUMES=/mnt/btrfs/one:/mnt/btrfs/two" >> "$GITHUB_ENV"

      - name: Create ReFS volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @"
          create vdisk file="$env:RUNNER_TEMP\refs.vhdx" maximum=4096 type=expandable
          select vdisk file="$env:RUNNER_TEMP\refs.vhdx"
          attach vdisk
          create partition primary
          format fs=refs quick
          assign letter=R
          "@
          $script | Set-Content "$env:RUNNER_TEMP\refs.txt"
          diskpart /s "$env:RUNNER_TEMP\refs.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C2FLUX_CLONE_DIRS=R:\" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/c2flux.Core.Tests/c2flux.Core.Tests.csproj --configuration Release --filter "FullyQualifiedName~Clones_on_real_volumes|FullyQualifiedName~Compressed_clones|FullyQualifiedName~Reads_the_file_system_type" --logger "console;verbosity=normal"

  # ZFS shows no shared blocks, so its totals only carry a mark. Apart from
  # clone-volumes: the driver comes from outside the runner image. macOS has no
  # job: its runners cannot load the kext.
  zfs-volume:
    name: Clones on a real ZFS volume (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Create ZFS pool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          if [ -e /sys/module/zfs/parameters/zfs_bclone_enabled ]; then
            echo 1 | sudo tee /sys/module/zfs/parameters/zfs_bclone_enabled
          fi
          truncate -s 1G "$RUNNER_TEMP/zfs.img"
          sudo zpool create -f -m /mnt/zfs c2flux "$RUNNER_TEMP/zfs.img"
          sudo chown "$(id -u):$(id -g)" /mnt/zfs
          sudo zfs version
          echo "C2FLUX_ZFS_DIR=/mnt/zfs" >> "$GITHUB_ENV"

      - name: Create ZFS pool
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/openzfsonwindows/openzfs/releases/download/zfswin-2.4.4rc8/OpenZFSOnWindows-2.4.4rc8.exe -OutFile "$env:RUNNER_TEMP\zfs.exe"
          $installer = Start-Process "$env:RUNNER_TEMP\zfs.exe" -ArgumentList "/SP- /NORESTART /ALLUSERS /VERYSILENT /SUPPRESSMSGBOXES" -PassThru
          if (-not $installer.WaitForExit(300000)) { throw "Installer timed out" }
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $env:Path += ";C:\Program Files\OpenZFS On Windows"
          fsutil file createnew C:\zfs.img 1073741824
          zpool create -f -O driveletter=Z c2flux "\\?\C:\zfs.img"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zfs version
          "C2FLUX_ZFS_DIR=Z:\" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/c2flux.Core.Tests/c2flux.Core.Tests.csproj --configuration Release --filter "FullyQualifiedName~Clones_on_zfs" --logger "console;verbosity=normal"

      - name: The clone really shared blocks
        if: runner.os == 'Linux'
        run: |
          sudo zpool sync c2flux
          sleep 6
          saved=$(sudo zpool get -Hp -o value bclonesaved c2flux)
          echo "bclonesaved: $saved"
          test "$saved" -gt 0

      - name: The clone really shared blocks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files\OpenZFS On Windows"
          zpool sync c2flux
          Start-Sleep -Seconds 6
          $saved = [long](zpool get -Hp -o value bclonesaved c2flux)
          Write-Host "bclonesaved: $saved"
          if ($saved -le 0) { throw "The pool saved nothing" }

  # Real network shares, in loopback. Apart from the other jobs: each OS sets up
  # its own servers.
  network-shares:
    name: Network shares (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Mount NFS and SMB
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server samba cifs-utils
          sudo mkdir -p /srv/c2flux-nfs /srv/c2flux-smb /mnt/nfs /mnt/smb
          sudo chown "$(id -u):$(id -g)" /srv/c2flux-nfs /srv/c2flux-smb
          echo "/srv/c2flux-nfs localhost(rw,sync,no_subtree_check,insecure)" | sudo tee -a /etc/exports
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -ra
          sudo mount -t nfs localhost:/srv/c2flux-nfs /mnt/nfs
          printf '[c2flux]\n  path = /srv/c2flux-smb\n  read only = no\n' | sudo tee -a /etc/samba/smb.conf
          (echo c2flux-ci; echo c2flux-ci) | sudo smbpasswd -s -a "$(id -un)"
          sudo systemctl restart smbd
          sudo mount -t cifs //localhost/c2flux /mnt/smb -o "username=$(id -un),password=c2flux-ci,uid=$(id -u),gid=$(id -g)"
          mount | grep -E '/mnt/(nfs|smb)'
          echo "C2FLUX_NETWORK_DIRS=/mnt/nfs:/mnt/smb" >> "$GITHUB_ENV"

      - name: Share a folder over SMB
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory C:\c2flux-share | Out-Null
          New-SmbShare -Name c2flux -Path C:\c2flux-share -FullAccess Everyone
          icacls C:\c2flux-share /grant "Everyone:(OI)(CI)F"
          Get-ChildItem \\localhost\c2flux
          "C2FLUX_NETWORK_DIRS=\\localhost\c2flux" >> $env:GITHUB_ENV

      - name: Mount NFS and SMB
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /private/tmp/c2flux-nfs /private/tmp/c2flux-smb
          sudo chown "$(id -u)" /private/tmp/c2flux-nfs /private/tmp/c2flux-smb
          chmod 777 /private/tmp/c2flux-smb
          mkdir "$RUNNER_TEMP/nfs" "$RUNNER_TEMP/smb"
          echo "/private/tmp/c2flux-nfs -alldirs localhost" | sudo tee /etc/exports
          sudo nfsd enable || true
          sudo nfsd start || sudo nfsd restart
          sleep 3
          showmount -e localhost
          sudo mount -t nfs -o resvport,nolocks,vers=3 localhost:/private/tmp/c2flux-nfs "$RUNNER_TEMP/nfs"
          sudo sysadminctl -addUser c2fluxci -password c2flux-ci
          sudo pwpolicy -u c2fluxci -sethashtypes SMB-NT on
          sudo dscl . -passwd /Users/c2fluxci c2flux-ci
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.smbd.plist
          sudo sharing -a /private/tmp/c2flux-smb -S c2flux -s 001
          sleep 3
          mount_smbfs "//c2fluxci:c2flux-ci@localhost/c2flux" "$RUNNER_TEMP/smb"
          mount | grep -E 'nfs|smbfs'
          echo "C2FLUX_NETWORK_DIRS=$RUNNER_TEMP/nfs:$RUNNER_TEMP/smb" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test tests/c2flux.Core.Tests/c2flux.Core.Tests.csproj --configuration Release --filter "FullyQualifiedName~Network_shares" --logger "console;verbosity=normal"
        env:
          C2FLUX_TIMINGS: ${{ runner.temp }}/timings-just-started.txt

      # A new NFS server makes locks wait out its grace period (usually 90 s).
      # A second, fast run tells that from a slowness users would see too.
      - name: Test again on a server past its grace period
        shell: bash
        run: |
          sleep 100
          dotnet test tests/c2flux.Core.Tests/c2flux.Core.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Network_shares"
        env:
          C2FLUX_TIMINGS: ${{ runner.temp }}/timings-settled.txt

      - name: Timings
        if: always()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP"/timings-*.txt; do
            echo "== $(basename "$file")"
            cat "$file"
          done

  # Phase 6: the app packaged for every RID (package.yml).
  packages:
    name: Packages
    uses: ./.github/workflows/package.yml

  test-tree:
    name: Synthetic test tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate test tree
        run: python tests/fixtures/generate_test_tree.py "${{ runner.temp }}/c2flux-test-tree" --profile small --manifest "${{ runner.temp }}/manifest.json"

      - name: Regenerate (must be deterministic)
        run: python tests/fixtures/generate_test_tree.py "${{ runner.temp }}/c2flux-test-tree" --profile small --manifest "${{ runner.temp }}/manifest-2.json" --force

      - name: Compare manifests
        shell: python
        run: |
          import json, os, sys
          temp = os.environ["RUNNER_TEMP"]
          def load(name):
              with open(os.path.join(temp, name), encoding="utf-8") as f:
                  data = json.load(f)
              data.pop("generated_at", None)
              return data
          a, b = load("manifest.json"), load("manifest-2.json")
          if a != b:
              sys.exit("Manifests differ between runs: generator is not deterministic")
          print(json.dumps(a["totals"], indent=2))
          print(json.dumps(a["skipped_features"], indent=2))

      - name: Remove test tree
        if: always()
        run: python tests/fixtures/generate_test_tree.py "${{ runner.temp }}/c2flux-test-tree" --clean

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: test-tree-manifest-${{ matrix.os }}
          path: ${{ runner.temp }}/manifest.json
          retention-days: 7
