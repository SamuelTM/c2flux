name: CI

on:
  push:
    branches:
      - master
      - cross-platform
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore c2flux.sln

      - name: Build
        run: dotnet build c2flux.sln --configuration Release --no-restore

      - name: Build benchmark tool
        run: dotnet build tests/c2flux.Benchmarks/c2flux.Benchmarks.csproj --configuration Release

      - name: Build screenshot tool
        run: dotnet build tests/c2flux.Screenshots/c2flux.Screenshots.csproj --configuration Release

      - name: Publish (same settings as release.yml)
        run: >
          dotnet publish src/c2flux.WinForms/c2flux.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: c2flux-win-x64-${{ github.sha }}
          path: publish
          retention-days: 7

  core-tests:
    name: Core and app tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Builds only c2flux.Core and its tests: plain net10.0, no Windows
      # Desktop pieces, so it must work everywhere.
      - name: Test
        run: dotnet test tests/c2flux.Core.Tests/c2flux.Core.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      # The Avalonia app on the headless platform: no display needed. The
      # captures (phase 5.4) are compared with the WinForms references.
      - name: Test app
        run: dotnet test tests/c2flux.App.Tests/c2flux.App.Tests.csproj --configuration Release
        env:
          C2FLUX_CHART_OUT: ${{ runner.temp }}/captures

      - name: Compare captures with the references
        if: always()
        shell: bash
        run: |
          python3 tests/fidelity/compare.py "$RUNNER_TEMP/captures" --out "$RUNNER_TEMP/captures/fidelity.md"
          cat "$RUNNER_TEMP/captures/fidelity.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-captures-${{ matrix.os }}
          path: ${{ runner.temp }}/captures
          retention-days: 7

  # Phase 6: the Avalonia app self-contained and trimmed for each RID,
  # checked with its self-test on a runner of that architecture.
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, arch: x64 }
          - { rid: win-arm64, os: windows-11-arm, arch: arm64 }
          - { rid: osx-arm64, os: macos-latest, arch: arm64 }
          - { rid: osx-x64, os: macos-15-intel, arch: x64 }
          - { rid: linux-x64, os: ubuntu-latest, arch: x86_64 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, arch: aarch64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The executable is renamed to c2flux: macOS refuses to run a file
      # named c2flux.App (it reads as an app bundle). The host finds
      # c2flux.App.dll by the name built into it.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/c2flux.App/c2flux.App.csproj --configuration Release --runtime ${{ matrix.rid }} --output "$RUNNER_TEMP/c2flux-${{ matrix.rid }}"
          cd "$RUNNER_TEMP/c2flux-${{ matrix.rid }}"
          if [ -f c2flux.App.exe ]; then mv c2flux.App.exe c2flux.exe; else mv c2flux.App c2flux; fi

      - name: Self-test
        shell: bash
        run: |
          cd "$RUNNER_TEMP/c2flux-${{ matrix.rid }}"
          if [ -f c2flux.exe ]; then ./c2flux.exe --self-test; else ./c2flux --self-test; fi

      # Windows: portable ZIP; macOS: .app in a .dmg; Linux: AppImage only.
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/c2flux.App/c2flux.App.csproj)
          publish="$RUNNER_TEMP/c2flux-${{ matrix.rid }}"
          mkdir -p "$RUNNER_TEMP/dist"
          case "${{ matrix.rid }}" in
            win-*)
              pwsh -NoProfile -Command "Compress-Archive -Path '$publish/*' -DestinationPath '$RUNNER_TEMP/dist/c2flux-$version-windows-${{ matrix.arch }}.zip'" ;;
            osx-*)
              packaging/package-macos.sh "$publish" "$version" "${{ matrix.arch }}" "$RUNNER_TEMP/dist" ;;
            linux-*)
              packaging/package-linux.sh "$publish" "$version" "${{ matrix.arch }}" "$RUNNER_TEMP/dist"
              APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/dist/c2flux-$version-linux-${{ matrix.arch }}.AppImage" --self-test ;;
          esac
          ls -la "$RUNNER_TEMP/dist"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: c2flux-${{ matrix.rid }}-${{ github.sha }}
          path: ${{ runner.temp }}/dist
          retention-days: 7

  test-tree:
    name: Synthetic test tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate test tree
        run: python tests/fixtures/generate_test_tree.py "${{ runner.temp }}/c2flux-test-tree" --profile small --manifest "${{ runner.temp }}/manifest.json"

      - name: Regenerate (must be deterministic)
        run: python tests/fixtures/generate_test_tree.py "${{ runner.temp }}/c2flux-test-tree" --profile small --manifest "${{ runner.temp }}/manifest-2.json" --force

      - name: Compare manifests
        shell: python
        run: |
          import json, os, sys
          temp = os.environ["RUNNER_TEMP"]
          def load(name):
              with open(os.path.join(temp, name), encoding="utf-8") as f:
                  data = json.load(f)
              data.pop("generated_at", None)
              return data
          a, b = load("manifest.json"), load("manifest-2.json")
          if a != b:
              sys.exit("Manifests differ between runs: generator is not deterministic")
          print(json.dumps(a["totals"], indent=2))
          print(json.dumps(a["skipped_features"], indent=2))

      - name: Remove test tree
        if: always()
        run: python tests/fixtures/generate_test_tree.py "${{ runner.temp }}/c2flux-test-tree" --clean

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: test-tree-manifest-${{ matrix.os }}
          path: ${{ runner.temp }}/manifest.json
          retention-days: 7
