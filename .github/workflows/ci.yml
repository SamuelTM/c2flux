name: CI

on:
  push:
    branches:
      - master
      - cross-platform
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore c2flux.sln

      - name: Build
        run: dotnet build c2flux.sln --configuration Release --no-restore

  core-tests:
    name: Core and app tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Builds only c2flux.Core and its tests: plain net10.0, no Windows
      # Desktop pieces, so it must work everywhere.
      - name: Test
        run: dotnet test tests/c2flux.Core.Tests/c2flux.Core.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      # The Avalonia app on the headless platform: no display needed. The
      # captures (phase 5.4) are compared with the WinForms references.
      - name: Test app
        run: dotnet test tests/c2flux.App.Tests/c2flux.App.Tests.csproj --configuration Release
        env:
          C2FLUX_CHART_OUT: ${{ runner.temp }}/captures

      - name: Compare captures with the references
        if: always()
        shell: bash
        run: |
          python3 tests/fidelity/compare.py "$RUNNER_TEMP/captures" --out "$RUNNER_TEMP/captures/fidelity.md"
          cat "$RUNNER_TEMP/captures/fidelity.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-captures-${{ matrix.os }}
          path: ${{ runner.temp }}/captures
          retention-days: 7

  # The extent readers on file systems with clones. Regular tests cover APFS on
  # arm64 (macos-latest); Intel calls fcntl differently, so it runs here. A
  # failing fcntl falls back to the clone id, which the partly rewritten clone
  # in the test catches.
  clone-volumes:
    name: Clones on real volumes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Create XFS and Btrfs volumes
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs btrfs-progs
          for fs in xfs btrfs; do
            truncate -s 1G "$RUNNER_TEMP/$fs.img"
            sudo "mkfs.$fs" -q "$RUNNER_TEMP/$fs.img"
            sudo mkdir -p "/mnt/$fs"
            sudo mount -o loop "$RUNNER_TEMP/$fs.img" "/mnt/$fs"
            sudo chown "$(id -u):$(id -g)" "/mnt/$fs"
          done
          btrfs subvolume create /mnt/btrfs/one
          btrfs subvolume create /mnt/btrfs/two
          echo "C2FLUX_CLONE_DIRS=/mnt/xfs:/mnt/btrfs" >> "$GITHUB_ENV"
          echo "C2FLUX_BTRFS_SUBVOLUMES=/mnt/btrfs/one:/mnt/btrfs/two" >> "$GITHUB_ENV"

      - name: Create ReFS volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @"
          create vdisk file="$env:RUNNER_TEMP\refs.vhdx" maximum=4096 type=expandable
          select vdisk file="$env:RUNNER_TEMP\refs.vhdx"
          attach vdisk
          create partition primary
          format fs=refs quick
          assign letter=R
          "@
          $script | Set-Content "$env:RUNNER_TEMP\refs.txt"
          diskpart /s "$env:RUNNER_TEMP\refs.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C2FLUX_CLONE_DIRS=R:\" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/c2flux.Core.Tests/c2flux.Core.Tests.csproj --configuration Release --filter "FullyQualifiedName~Clones_on_real_volumes|FullyQualifiedName~Compressed_clones" --logger "console;verbosity=normal"

  # ZFS shows no shared blocks, so its totals only carry a mark. Apart from
  # clone-volumes: the module comes from the runner's kernel packages.
  zfs-volume:
    name: Clones on a real ZFS volume
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Create ZFS pool
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          if [ -e /sys/module/zfs/parameters/zfs_bclone_enabled ]; then
            echo 1 | sudo tee /sys/module/zfs/parameters/zfs_bclone_enabled
          fi
          truncate -s 1G "$RUNNER_TEMP/zfs.img"
          sudo zpool create -f -m /mnt/zfs c2flux "$RUNNER_TEMP/zfs.img"
          sudo chown "$(id -u):$(id -g)" /mnt/zfs
          zfs version
          echo "C2FLUX_ZFS_DIR=/mnt/zfs" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test tests/c2flux.Core.Tests/c2flux.Core.Tests.csproj --configuration Release --filter "FullyQualifiedName~Clones_on_zfs" --logger "console;verbosity=normal"

  # Phase 6: the app packaged for every RID (package.yml).
  packages:
    name: Packages
    uses: ./.github/workflows/package.yml

  test-tree:
    name: Synthetic test tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate test tree
        run: python tests/fixtures/generate_test_tree.py "${{ runner.temp }}/c2flux-test-tree" --profile small --manifest "${{ runner.temp }}/manifest.json"

      - name: Regenerate (must be deterministic)
        run: python tests/fixtures/generate_test_tree.py "${{ runner.temp }}/c2flux-test-tree" --profile small --manifest "${{ runner.temp }}/manifest-2.json" --force

      - name: Compare manifests
        shell: python
        run: |
          import json, os, sys
          temp = os.environ["RUNNER_TEMP"]
          def load(name):
              with open(os.path.join(temp, name), encoding="utf-8") as f:
                  data = json.load(f)
              data.pop("generated_at", None)
              return data
          a, b = load("manifest.json"), load("manifest-2.json")
          if a != b:
              sys.exit("Manifests differ between runs: generator is not deterministic")
          print(json.dumps(a["totals"], indent=2))
          print(json.dumps(a["skipped_features"], indent=2))

      - name: Remove test tree
        if: always()
        run: python tests/fixtures/generate_test_tree.py "${{ runner.temp }}/c2flux-test-tree" --clean

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: test-tree-manifest-${{ matrix.os }}
          path: ${{ runner.temp }}/manifest.json
          retention-days: 7
