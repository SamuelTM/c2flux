name: UI screenshots

# Captures every c2flux window of a given version (by default the
# baseline-winforms tag) on a Windows runner and uploads the PNGs. These are
# the visual references of ROADMAP.md phase 0.3.

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Git ref of the app to capture"
        default: baseline-winforms
        type: string
      display:
        description: "Desktop resolution to request"
        default: "1920x1080"
        type: string
      main_size:
        description: "Main window size"
        default: "1280x800"
        type: string
  push:
    branches:
      - cross-platform
    paths:
      - "tests/c2flux.Screenshots/**"
      - ".github/workflows/ui-screenshots.yml"
      - ".github/actions/ntfs-test-volume/**"
      - "src/c2flux.WinForms/**"

permissions:
  contents: read

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshots (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      # Manual runs default to baseline-winforms; pushes capture the pushed
      # commit, so fixes to the app show up in the next screenshots.
      APP_REF: ${{ inputs.app_ref || github.sha }}
      DISPLAY_SIZE: ${{ inputs.display || '1920x1080' }}
      MAIN_SIZE: ${{ inputs.main_size || '1280x800' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout tools
        uses: actions/checkout@v7
        with:
          path: tools

      - name: Checkout app (${{ env.APP_REF }})
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_REF }}
          path: app

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish app
        # The app project moved to src/c2flux.WinForms in phase 1; older refs
        # (such as baseline-winforms) still have it at the root.
        run: |
          $project = @('src/c2flux.WinForms/c2flux.csproj', 'c2flux.csproj') | ForEach-Object { Join-Path 'app' $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $project) { throw "No c2flux.csproj found in app" }
          dotnet publish $project --configuration Release --runtime win-x64 --self-contained false --output "$env:RUNNER_TEMP\app"

      # c2flux reads its settings and languages from the directory of the
      # running executable, so the tool runs from inside the app directory.
      - name: Publish screenshot tool into the app directory
        run: dotnet publish tools/tests/c2flux.Screenshots/c2flux.Screenshots.csproj --configuration Release --output "$env:RUNNER_TEMP\app"

      # Same fixed content as the scanner benchmark, so the charts look the
      # same in every run and the scanned path reads T:\ in the UI.
      - name: Create NTFS test volume (T:)
        uses: ./tools/.github/actions/ntfs-test-volume
        with:
          generator: tools/tests/fixtures/generate_test_tree.py
          profile: medium
          manifest: ${{ runner.temp }}/test-tree-manifest.json
          required: "true"

      - name: Capture screenshots
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'screenshots'
          & "$env:RUNNER_TEMP\app\c2flux-shots.exe" --out $out --scan 'T:\' --display $env:DISPLAY_SIZE --main-size $env:MAIN_SIZE
          $code = $LASTEXITCODE

          $index = Get-Content (Join-Path $out 'index.json') -Raw | ConvertFrom-Json
          $summary = @(
            "## UI screenshots",
            "",
            "App: ``$env:APP_REF`` ($($index.app_version)) · Display: $($index.display) · DPI: $($index.dpi)",
            "",
            "✅ captured · ⚠️ captured an unhandled-exception dialog of the app (app bug) · ❌ capture failed",
            "",
            "| | Capture | Window | Size | Method |",
            "|---|---|---|---|---|"
          )
          foreach ($capture in $index.captures) {
            $icon = switch ($capture.status) { 'ok' { '✅' } 'app-error' { '⚠️' } default { '❌' } }
            $size = if ($capture.width) { "$($capture.width)×$($capture.height)" } else { '—' }
            $detail = switch ($capture.status) {
              'ok' { $capture.method }
              'app-error' { "unhandled exception in the app: $($capture.title)" }
              default { ($capture.error -split "`n")[0] }
            }
            $summary += "| $icon | $($capture.name) | $($capture.form_type) | $size | $detail |"
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          # Failed captures are reported but do not fail the job: the images
          # that did work are still useful, and failures are listed above.
          if ($code -ne 0) { Write-Warning "Some captures failed (exit code $code)." }
          exit 0

      # Databases and logs the app wrote during the run, to investigate what a
      # screen shows (for example the scan history comparison).
      - name: Upload app data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-app-data-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/app/ScanHistory
            ${{ runner.temp }}/app/StorageHistory
            ${{ runner.temp }}/app/Settings
            ${{ runner.temp }}/app/**/*.db
            ${{ runner.temp }}/app/**/storage_history*.json
            ${{ runner.temp }}/app/**/*.log
            ${{ runner.temp }}/test-tree-manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ env.APP_REF }}-${{ github.run_number }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 30
