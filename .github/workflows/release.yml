name: Release

# A tag v* builds the packages for every system (package.yml), then creates
# the GitHub release with them. Final releases also add their notes to
# CHANGELOG.md on the default branch; pre-releases (-alpha, -beta, -rc) do
# not. A manual run can instead rebuild CHANGELOG.md from all releases.

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.0.0"
        required: false
        type: string

      backfill_changelog:
        description: "Rebuild CHANGELOG.md from all GitHub releases"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: c2flux-release-changelog
  cancel-in-progress: false

jobs:
  meta:
    name: Tag and version
    if: ${{ !inputs.backfill_changelog }}
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Read the tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $tag = "${{ inputs.tag }}"
          }
          else {
              $tag = "${{ github.ref_name }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
              throw "Release tag is required"
          }

          if (-not $tag.StartsWith("v")) {
              throw "Release tag must start with 'v'"
          }

          $version = $tag.TrimStart("v")
          $isPrerelease = $version -match "-(alpha|beta|rc)(\.|$)"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  packages:
    name: Packages
    needs: meta
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.meta.outputs.tag }}
      version: ${{ needs.meta.outputs.version }}

  release:
    name: Release
    needs: [meta, packages]
    if: ${{ always() && (inputs.backfill_changelog || needs.packages.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        if: ${{ !inputs.backfill_changelog }}
        uses: actions/download-artifact@v7
        with:
          pattern: c2flux-package-*
          merge-multiple: true
          path: packages

      - name: Create the GitHub release
        if: ${{ !inputs.backfill_changelog }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          files: packages/*
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.is_prerelease }}

      - name: Check out the default branch for CHANGELOG.md
        if: ${{ inputs.backfill_changelog || needs.meta.outputs.is_prerelease != 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Rebuild CHANGELOG.md from all releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_changelog }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api `
              --paginate `
              "repos/${{ github.repository }}/releases?per_page=100" `
              | ConvertFrom-Json

          $publishedReleases = $releases |
              Where-Object {
                  -not $_.draft -and
                  -not [string]::IsNullOrWhiteSpace($_.tag_name)
              } |
              Sort-Object {
                  [DateTime]$_.published_at
              } -Descending

          $sections = New-Object System.Collections.Generic.List[string]

          foreach ($release in $publishedReleases) {
              $tag = $release.tag_name
              $body = [string]$release.body

              $section = "## Changelog $tag"

              if (-not [string]::IsNullOrWhiteSpace($body)) {
                  $section += "`r`n`r`n" + $body.Trim()
              }

              $sections.Add($section)
          }

          $content = [string]::Join(
              "`r`n`r`n",
              $sections
          )

          if (-not [string]::IsNullOrEmpty($content)) {
              $content += "`r`n"
          }

          [System.IO.File]::WriteAllText(
              (Join-Path $PWD "CHANGELOG.md"),
              $content,
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: Add the new release to CHANGELOG.md
        if: ${{ !inputs.backfill_changelog && needs.meta.outputs.is_prerelease != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.meta.outputs.tag }}"
          $release = gh release view $tag --json body | ConvertFrom-Json
          $body = [string]$release.body

          $existing = ""
          if (Test-Path "CHANGELOG.md") {
              $existing = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8
          }

          $heading = "## Changelog $tag"

          if ($existing -match [regex]::Escape($heading)) {
              Write-Host "$heading already exists"
              exit 0
          }

          $section = "$heading`r`n`r`n$body`r`n`r`n"

          [System.IO.File]::WriteAllText(
              (Join-Path $PWD "CHANGELOG.md"),
              $section + $existing,
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: Commit CHANGELOG.md
        if: ${{ inputs.backfill_changelog || needs.meta.outputs.is_prerelease != 'true' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if (git diff --cached --quiet) {
              exit 0
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.backfill_changelog }}" -eq "true") {
              $commitMessage = "Rebuild CHANGELOG from GitHub releases"
          }
          else {
              $commitMessage = "Update CHANGELOG for ${{ needs.meta.outputs.tag }}"
          }

          git commit -m $commitMessage

          $defaultBranch = "${{ github.event.repository.default_branch }}"
          git fetch origin $defaultBranch
          git rebase "origin/$defaultBranch"
          git push origin "HEAD:$defaultBranch"
